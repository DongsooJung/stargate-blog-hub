plugins {
    id "com.android.application"
}

android {
    namespace "kr.co.stargateedu.blog"
    compileSdk 35

    defaultConfig {
        applicationId "kr.co.stargateedu.blog"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.6.2"
}
