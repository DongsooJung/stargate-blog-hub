name: Math Daily 하루 한 문제

on:
  schedule:
    - cron: '10 1 * * *'   # KST 10:10
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - publish
  push:
    paths:
      - '.github/workflows/math-daily-publish.yml'
      - 'scripts/publish_math_problem.py'

permissions:
  contents: write

concurrency:
  group: math-daily-publish
  cancel-in-progress: false

jobs:
  publish-one:
    name: 수학 문제 1건 점검·발행
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 다음 문제 확인 또는 1건 발행
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MODE: ${{ inputs.mode }}
          MATH_PROBLEMS_URL: https://stargateedu.co.kr/research/math/archive/problems.json
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            python3 scripts/publish_math_problem.py --publish
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_MODE" = "publish" ]; then
            python3 scripts/publish_math_problem.py --publish
          else
            python3 scripts/publish_math_problem.py
          fi

      - name: 변경 사항 커밋
        run: |
          if git diff --quiet -- math/posts.json math/publish-state.json math/problems/ math/naver-queue/; then
            echo "::notice::발행 변경 없음 — dry-run 또는 대기 상태"
            exit 0
          fi
          git config user.name 'stargate-math-bot'
          git config user.email 'bot@stargate11.com'
          git add math/posts.json math/publish-state.json math/problems/ math/naver-queue/
          git commit -m "feat(math): publish daily problem"
          git push
