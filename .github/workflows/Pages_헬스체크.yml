name: Pages 헬스체크

# ┌───────────────────────────────────────────────────────────────┐
# │ 매일 blog.stargateedu.co.kr 루트 200 OK·HSTS 와                 │
# │ 주요 페이지·피드의 스타게이트 도메인 링크(404 등)를 점검합니다. │
# │ 실패 시 GitHub Issue 를 자동 생성합니다.                        │
# └───────────────────────────────────────────────────────────────┘

on:
  schedule:
    - cron: '30 0 * * *'    # 매일 UTC 00:30 → KST 09:30
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'posts/**'
      - 'math/**'
      - 'reading/**'
      - '.github/workflows/Pages_헬스체크.yml'
      - 'scripts/check_links.py'

permissions:
  contents: read
  issues: write

jobs:
  health:
    name: 도메인 · SSL · 응답 검증
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: curl 헬스체크
        id: check
        run: |
          set +e
          URL="https://blog.stargateedu.co.kr/"
          STATUS=$(curl -sS -o /tmp/body.html -w "%{http_code}" -L --max-time 15 "$URL")
          SIZE=$(stat -c%s /tmp/body.html 2>/dev/null || echo 0)
          SSL=$(curl -sSI --max-time 10 "$URL" | grep -ic 'strict-transport-security' || true)
          echo "status=$STATUS"  >> $GITHUB_OUTPUT
          echo "size=$SIZE"      >> $GITHUB_OUTPUT
          echo "hsts=$SSL"       >> $GITHUB_OUTPUT
          echo "::notice::HTTP $STATUS · ${SIZE}B · HSTS=$SSL"
          test "$STATUS" = "200"

      - uses: actions/checkout@v4
        if: always()

      - name: 배포 반영 대기 (push 시)
        if: github.event_name == 'push'
        run: sleep 90

      - name: 링크 전수 검사
        id: links
        if: always()
        env:
          BROKEN_OUT: broken-links.txt
        run: |
          set +e
          python3 scripts/check_links.py
          RC=$?
          { echo 'list<<EOF'; cat broken-links.txt 2>/dev/null; echo; echo 'EOF'; } >> $GITHUB_OUTPUT
          exit $RC

      - name: 실패 시 Issue 생성
        if: failure()
        uses: actions/github-script@v7
        env:
          BROKEN: ${{ steps.links.outputs.list }}
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({...context.repo, state: 'open', labels: 'hub-down'});
            if (existing.data.length) { console.log('열린 hub-down 이슈가 있어 새로 만들지 않습니다.'); return; }
            const title = `🚨 허브 다운 감지 — ${new Date().toISOString().slice(0,16)}`;
            const body  = [
              '## blog.stargateedu.co.kr 헬스체크 실패',
              '',
              `- 루트 HTTP 상태: **${{ steps.check.outputs.status }}**`,
              `- 응답 크기: **${{ steps.check.outputs.size }} B**`,
              `- HSTS 헤더: **${{ steps.check.outputs.hsts }}**`,
              '',
              '### 깨진 링크',
              process.env.BROKEN || '(없음)',
              '',
              '### 점검 순서',
              '1. Settings → Pages → 배포 상태',
              '2. DNS: `dig blog.stargateedu.co.kr +short`',
              '3. Cafe24 DNS 의 `blog` CNAME 레코드 확인',
              '4. GitHub Actions: 최근 "허브 RSS 자동갱신" 실행 로그',
            ].join('\n');
            await github.rest.issues.create({
              ...context.repo, title, body,
              labels: ['production', 'urgent', 'hub-down']
            });
