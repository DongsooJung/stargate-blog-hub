<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STARGATE MATH | 하루 한 문제</title><meta name="description" content="성대경시형·사고력·평가원 수학 문제를 하루 한 문제씩 풀이하는 STARGATE 수학 블로그."><link rel="canonical" href="https://blog.stargateedu.co.kr/math/"><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;background:#f7f9fc;color:#182038;line-height:1.65}a{color:inherit}.w{width:min(960px,calc(100% - 36px));margin:auto}nav{background:#0b1738;color:#fff}nav .w{min-height:60px;display:flex;justify-content:space-between;align-items:center}nav a{text-decoration:none}.hero{padding:72px 0 56px;background:radial-gradient(circle at 18% 8%,rgba(217,164,65,.22),transparent 34%),linear-gradient(145deg,#0b1738,#24466e);color:#fff}.hero small{color:#f1c77a;font-weight:900}.hero h1{font-size:clamp(34px,6vw,54px);line-height:1.15;margin:10px 0}.hero p{max-width:720px;color:#dce3f2}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.chip{padding:7px 11px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.06)}main{padding:42px 0 64px}.status{padding:16px 18px;border-left:4px solid #d9a441;background:#fff8e8;border-radius:10px;margin-bottom:20px}.feed{display:grid;gap:14px}.post{background:#fff;border:1px solid #e3e8f2;border-radius:15px;padding:20px;box-shadow:0 8px 24px rgba(11,23,56,.04)}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}.tag{font-size:.76rem;padding:4px 8px;border-radius:999px;background:#eef2f8}.tag.accent{background:#fff4d9;color:#7a5310;font-weight:900}.post h2{font-size:1.18rem;margin:4px 0 8px}.post p{margin:0;color:#59647d}.actions{margin-top:13px;display:flex;gap:14px;flex-wrap:wrap}.actions a{color:#0b3d91;font-weight:800;text-decoration:none}.empty{padding:30px;text-align:center;border:1px dashed #cdd4e2;border-radius:14px;background:#fff;color:#66708d}footer{padding:26px;background:#07102a;color:#9aa4bf;text-align:center}</style></head><body><nav><div class="w"><a href="/"><b>STARGATE BLOG</b></a><a href="/posts/">전체 글</a></div></nav><header class="hero"><div class="w"><small>ONE PROBLEM A DAY · MATH</small><h1>STARGATE MATH<br>하루 한 문제</h1><p>연구 대시보드의 수학 문제 아카이브를 원천 데이터로 사용해 한 문제씩 문제·힌트·단계별 풀이·정답을 발행합니다.</p><div class="chips"><span class="chip">성대경시형</span><span class="chip">생각하는황소형</span><span class="chip">중등 사고력</span><span class="chip">자동발행 준비</span></div></div></header><main><div class="w"><div class="status" id="status">발행 피드를 확인하는 중입니다.</div><div class="feed" id="feed"></div></div></main><footer>© 2026 Stargate Corporation · blog.stargateedu.co.kr/math/</footer><script>const feed=document.getElementById('feed'),status=document.getElementById('status'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));fetch('posts.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{const posts=d.posts||[];status.innerHTML=posts.length?`현재 <b>${posts.length}개</b> 문제 풀이가 발행되어 있습니다. 마지막 갱신: ${esc(d.updated_at||'-')}`:'자동발행 파이프라인은 준비되어 있으며 아직 공개 발행을 시작하지 않았습니다.';feed.innerHTML=posts.length?posts.map(p=>`<article class="post"><div class="meta"><span class="tag accent">${esc(p.series)}</span><span class="tag">${esc(p.level)}</span><span class="tag">${esc(p.topic)}</span><span class="tag">${esc(p.date)}</span></div><h2>${esc(p.title)}</h2><p>${esc(p.summary)}</p><div class="actions"><a href="/math/problems/${encodeURIComponent(p.id)}/">풀이 읽기 →</a><a href="${esc(p.research_url)}">연구 아카이브 →</a></div></article>`).join(''):'<div class="empty">첫 문제 발행 대기 중입니다.</div>'}).catch(()=>{status.textContent='피드 로드에 실패했습니다.';feed.innerHTML='<div class="empty">잠시 후 다시 확인해 주세요.</div>'});</script></body></html>
